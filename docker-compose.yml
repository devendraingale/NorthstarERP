services:
  northstar-erp:
    build: .
    image: northstar-erp:local
    container_name: northstar-erp
    restart: unless-stopped
    environment:
      PORT: 8000
      NORTHSTAR_DB: /data/northstar.sqlite3
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - northstar_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 5s
volumes:
  northstar_data:
